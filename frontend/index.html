<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EVSPolls runs secure, transparent elections for student councils, faculty senates and alumni boards." />
    <title>EVSPolls | Secure Online Elections</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical resources -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" />

    <!-- Theme color for mobile browsers: primary-600 from tailwind.config.js -->
    <meta name="theme-color" content="#0284c7" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:site_name" content="EVSPolls" />
    <meta property="og:title" content="EVSPolls | Secure Online Elections" />
    <meta
      property="og:description"
      content="EVSPolls runs secure, transparent elections for student councils, faculty senates and alumni boards." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://evspolls.netlify.app/" />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
